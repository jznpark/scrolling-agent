<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrolling Agent Demo</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <b>Scrolling Agent</b> <span id="label" class="label"></span>
      <span id="module" class="muted small"></span>
    </div>
    <div class="controls">
      <button id="open-settings" title="모든 설정">⚙ 설정</button>
      <label><span class="lt">정책 <span class="help" data-help="policy">?</span></span>
        <select id="policy"></select></label>
      <label><span class="lt">ρ <span class="help" data-help="rho">?</span></span>
        <input id="rho" type="number" step="0.05" value="0.6"></label>
      <label id="dwell-wrap"><span class="lt">dwell <span class="help" data-help="dwell">?</span></span>
        <input id="dwell" type="number" step="0.25" value="0.5"></label>
      <label><span class="lt">seed <span class="help" data-help="seed">?</span></span>
        <span class="inline"><input id="seed" type="number" value="10000"><button id="seed-random" title="무작위 seed">🎲</button></span></label>
      <button id="reset" class="primary">다시 시작 (R)</button>
      <span class="sep"></span>
      <button id="play" class="primary">▶ 재생 (P)</button>
      <button id="step">한 스텝 (N)</button>
      <label><span class="lt">속도 <span class="help" data-help="speed">?</span></span>
        <span class="inline"><input id="speed" type="range" min="1" max="200" value="10"><span id="speed-label" class="small"></span></span></label>
      <label class="check"><input id="hidden" type="checkbox"> 숨은 값 (H) <span class="help" data-help="hidden">?</span></label>
    </div>
  </header>

  <main class="split">
    <section class="half" id="left">
      <h2>휴대폰 화면 <span id="phone-mode" class="pill"></span></h2>
      <div class="phone-area">
        <div class="phone"><div class="notch"></div><canvas id="phone"></canvas></div>
        <div class="mapcol">
          <h3>전체 목록</h3>
          <canvas id="minimap"></canvas>
          <div class="legend small">
            <div><i style="background:var(--known)"></i>이해함</div>
            <div><i style="background:var(--evidence)"></i>증거 쌓는 중</div>
            <div><i style="background:var(--watch)"></i>본 시간</div>
            <div><i class="box"></i>화면</div>
          </div>
        </div>
      </div>
      <div id="keys" class="muted small"></div>
    </section>

    <section class="half" id="right">
      <h2>보상률</h2>
      <div class="card">
        <h3><span id="curve-title">시청 중인 콘텐츠의 보상률</span> <span class="help" data-help="curve">?</span></h3>
        <canvas id="curve"></canvas>
      </div>
      <div class="card">
        <h3>알고 있는 후보의 지금 보상률 <span class="help" data-help="rates">?</span></h3>
        <canvas id="rates"></canvas>
      </div>
      <div class="card">
        <h3>누적 보상 (초록 = 시청 중)</h3>
        <canvas id="chart"></canvas>
      </div>
      <div class="two">
        <div class="card"><h3>상태</h3><table id="stats"></table></div>
        <div class="card"><h3>사건</h3><ol id="events"></ol></div>
      </div>
    </section>
  </main>

  <aside id="drawer" class="drawer" hidden>
    <div class="drawer-head">
      <b>설정</b>
      <button id="defaults" class="small-btn">기본값으로</button>
      <button id="close-settings" class="small-btn">닫기 ✕</button>
    </div>
    <p class="muted small">바꾼 값만 적용됩니다(파란색). <span class="tag ext">ext</span> 확장 ·
      <span class="tag draft">draft</span> 초안 · <span class="tag tbd">TBD</span> 팀 임시값 · <b>?</b>에 마우스를 올리면 설명</p>
    <div id="settings"></div>
    <button id="apply" class="primary wide">적용하고 다시 시작</button>
  </aside>

  <div id="tooltip" class="tooltip" hidden></div>
  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
