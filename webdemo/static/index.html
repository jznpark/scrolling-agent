<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrolling Agent Demo</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <h1>Scrolling Agent <span id="label" class="label"></span></h1>
    <span id="module" class="muted small"></span>
  </header>

  <main class="layout">
    <aside id="controls" class="panel">
      <h2>정책</h2>
      <label>policy <select id="policy"></select></label>
      <div class="row">
        <label title="시청 중단 기준 보상률">rho <input id="rho" type="number" step="0.05" value="0.6"></label>
        <label title="greedy-dwell: 미파악 후보 하나당 최대 멈춤 시간(초)">dwell <input id="dwell" type="number" step="0.25" value="0.5"></label>
      </div>
      <div class="row">
        <label>seed <input id="seed" type="number" value="10000"></label>
        <button id="seed-random" title="무작위 seed">🎲</button>
      </div>
      <button id="reset" class="primary wide">적용하고 다시 시작 (R)</button>

      <h2>설정 <button id="defaults" class="small-btn">기본값</button></h2>
      <p class="muted small">바꾼 값만 적용됩니다. <span class="tag ext">ext</span> = 확장, <span class="tag draft">draft</span> = 초안, <span class="tag tbd">TBD</span> = 팀 임시값</p>
      <div id="settings"></div>
    </aside>

    <section id="stage" class="panel">
      <div class="toolbar">
        <button id="play" class="primary">▶ 재생 (P)</button>
        <button id="step">한 스텝 (N)</button>
        <label class="speed">속도 <input id="speed" type="range" min="1" max="200" value="10"> <span id="speed-label"></span></label>
        <label class="small"><input id="hidden" type="checkbox"> 숨은 값 보기 (H)</label>
      </div>
      <div class="canvas-wrap"><canvas id="list"></canvas></div>
      <div id="keys" class="muted small"></div>
    </section>

    <section id="side" class="panel">
      <div class="side-top">
        <div>
          <h2>전체 목록</h2>
          <canvas id="minimap"></canvas>
        </div>
        <div class="grow">
          <h2>상태</h2>
          <table id="stats"></table>
        </div>
      </div>
      <h2>누적 보상</h2>
      <canvas id="chart"></canvas>
      <h2>사건</h2>
      <ol id="events"></ol>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
