[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scrolling-agent"
version = "0.1.0"
description = "Scrolling agent: time allocation between exploring, watching and revisiting a feed (DDM + PPO)"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "CSI6545 Team 4" }]
dependencies = [
    "numpy>=1.24",
    "gymnasium>=0.29",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
    "matplotlib>=3.7",
    "tensorboard>=2.14",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
